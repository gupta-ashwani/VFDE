events {}

http {
    # Custom format: includes $request_time and $body_bytes_sent, which the
    # verification layer (Phase 3) uses as response evidence.
    log_format vfde '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log vfde;

    # Trust the original client address when requests arrive via Docker's gateway.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;

    server {
        listen 80;
        location / {
            proxy_pass http://dvwa:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
