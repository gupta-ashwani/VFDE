# Thresholds, patterns and MITRE IDs live here, not in code.
# Tune these against your labelled dataset (Phase 5: eval.py).

# ---- Operator context: sources that are known and authorised ----
# Alerts from these sources are kept in the raw list but judged Noise with the stated
# reason, so the decision stays auditable. A dataset can also ship its own
# <log_dir>/allowlist.yaml (same format) which is merged in at run time.
# allowlist:
#   - {source: "10.10.0.5", reason: "authorised internal vulnerability scanner"}
#   - {source: "10.20.0.0/24", reason: "monitoring subnet"}
allowlist: []

# ---- Phase 4: kill-chain correlation ----
correlation:
  gap_seconds: 1800                # alerts from one IP further apart than this = separate incidents
  include_verdicts: [Confirmed, Likely, Attempted]   # Noise is never correlated
  stages: [Reconnaissance, Initial Access, Compromise, Post-Exploitation]   # kill-chain order
  attempted_only_severity_cap: Medium   # an incident with no Confirmed/Likely alert never exceeds this
  multi_stage_bump_at: 3           # incidents spanning >= this many stages get one severity level up

# ---- Phase 3: verification layer ----
verification:
  cluster_window_seconds: 120      # pattern alerts from one IP this close = one probing burst
  cluster_attempted: 2             # >= this many probes in a burst  -> at least Attempted
  cluster_likely: 3                # >= this many probes in a burst  -> Likely
  impact_status: 500               # server error on injected input = impact evidence
  impact_rt_seconds: 3.0           # response this slow = time-based injection evidence
  impact_size_multiplier: 1.25     # response bigger than baseline p95 * this = data-leak evidence
  baseline_min_samples: 20         # per-path baseline needs this many clean samples, else global
  baseline_size_percentile: 95
  automated_interval_seconds: 3.0  # failures spaced tighter than this look scripted
  min_distinct_users: 3            # password spraying / username guessing
  max_user_typo_failures: 8        # one valid user failing a few times then succeeding = typo
  static_extensions: [".png", ".jpg", ".jpeg", ".gif", ".svg", ".css", ".js", ".ico", ".woff", ".woff2", ".map"]
  healthcheck_max_paths: 2         # tool-like UA touching <= this many paths, no errors = monitor
  login_success_lookahead_seconds: 3600   # a login from the same IP this soon after guessing = Confirmed
  sensitive_likely_paths: 5        # >= this many distinct sensitive paths probed = Likely
  # A single XSS-looking string is Noise (people discuss markup), unless it carries an
  # executable payload: calls, cookie access, event handlers, javascript: URLs.
  xss_executable_patterns:
    - '(?i)\b(alert|prompt|confirm|eval)\s*\('
    - '(?i)document\.(cookie|location|write)'
    - '(?i)\bon(error|load|mouseover|focus)\s*='
    - '(?i)javascript\s*:'
    - '(?i)string\.fromcharcode'

brute_force:
  enabled: true
  threshold: 5            # failed logins from one IP ...
  window_seconds: 60      # ... inside this window
  severity: High
  mitre: T1110
  cooldown_seconds: 300   # one alert per IP per cooldown

# Slow / low-and-slow guessing: no 60-second burst ever forms, but one IP keeps failing
# against many different usernames over a long window.
slow_brute_force:
  enabled: true
  min_failures: 6
  min_distinct_users: 4
  window_seconds: 3600
  severity: High
  mitre: T1110
  cooldown_seconds: 1800

success_after_failures:
  enabled: true
  min_failures: 3
  window_seconds: 300
  severity: Critical
  mitre: T1078

scan_404:
  enabled: true
  threshold: 15           # 404 responses from one IP ...
  window_seconds: 30
  severity: Medium
  mitre: T1595
  cooldown_seconds: 300

# Requests for paths real users rarely ask for (VCS folders, env/backup files, admin
# panels, server-status...) that come back 3xx/4xx. Counts DISTINCT paths, so a few
# misses are fine but a sweep is not. Successful (200) hits are not counted: that is
# how a legitimate admin looks.
sensitive_path_probe:
  enabled: true
  min_paths: 3
  window_seconds: 300
  statuses: [301, 302, 401, 403, 404]
  severity: Medium
  mitre: T1595
  cooldown_seconds: 300
  patterns:
    - '(?i)/\.(git|svn|hg|env|htaccess|htpasswd|ds_store)\b'
    - '(?i)/(wp-admin|wp-login|wp-config|phpmyadmin|pma|administrator|admin|manager|console|actuator)(/|\.|$)'
    - '(?i)/(backup|backups|old|bak|dump|db|sql)(/|\.|$)'
    - '(?i)\.(bak|old|sql|zip|tar|tgz|gz|rar|swp|orig)$'
    - '(?i)/(phpinfo|server-status|server-info)(\.php)?$'
    - '(?i)/(config|configuration|settings|web)\.(php|json|yml|yaml|xml|inc|conf)$'
    - '(?i)/cgi-bin/'

sqli_pattern:
  enabled: true
  severity: High
  mitre: T1190
  patterns:
    - "(?i)\\bunion\\b\\s+(all\\s+)?\\bselect\\b"
    - "(?i)'\\s*or\\s*'?\\d+'?\\s*=\\s*'?\\d+"
    - "(?i)\\bor\\b\\s+\\d+\\s*=\\s*\\d+"
    - "(?i)(sleep|benchmark|pg_sleep)\\s*\\("
    - "(?i)information_schema"
    - "(?i)'\\s*;\\s*(drop|insert|update|delete)\\b"
    - "(?i)--\\s*$"

xss_pattern:
  enabled: true
  severity: Medium
  mitre: T1190
  patterns:
    - "(?i)<\\s*script\\b"
    - "(?i)\\bon(error|load|mouseover|focus)\\s*="
    - "(?i)javascript\\s*:"

path_traversal:
  enabled: true
  severity: High
  mitre: T1083
  patterns:
    - "(\\.\\./){2,}"
    - "(?i)/etc/(passwd|shadow)"
    - "(?i)\\bwin\\.ini\\b"

scanner_user_agent:
  enabled: true
  severity: Medium
  mitre: T1595
  agents: [sqlmap, nikto, nmap, gobuster, ffuf, dirbuster, dirb, feroxbuster, wfuzz, wpscan, masscan,
           nuclei, acunetix, nessus, openvas, arachni, w3af, skipfish, whatweb, zgrab]
  cooldown_seconds: 300

off_hours_login:
  enabled: true
  severity: Low
  mitre: T1078
  start_hour: 0           # UTC, inclusive
  end_hour: 5             # UTC, exclusive

sudo_failures:
  enabled: true
  threshold: 3
  window_seconds: 300
  severity: High
  mitre: T1068
